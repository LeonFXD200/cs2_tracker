name: Fetch CS2 Prices

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert CS2 prices
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, sys

          def fetch_csgotrader():
              url = 'https://prices.csgotrader.app/latest/prices_v6.json'
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = json.loads(resp.read())
              result = []
              for name, data in raw.items():
                  if not isinstance(data, dict):
                      continue
                  steam = data.get('steam', {})
                  if not isinstance(steam, dict):
                      continue
                  p24  = steam.get('last_24h')
                  p7d  = steam.get('last_7d')
                  p30d = steam.get('last_30d')
                  price = p24 or p7d or p30d
                  if not price:
                      continue
                  result.append({
                      'market_hash_name': name,
                      'currency': 'USD',
                      'suggested_price': round(float(price), 2),
                      'price_7d':  round(float(p7d),  2) if p7d  else None,
                      'price_30d': round(float(p30d), 2) if p30d else None,
                      'min_price': round(float(p7d  or price), 2),
                      'max_price': round(float(p30d or price), 2),
                      'mean_price': round(float(p7d or price), 2),
                      'quantity': 1,
                  })
              return result

          def fetch_skinport():
              url = 'https://api.skinport.com/v1/items?app_id=730&currency=USD'
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Accept': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read())

          result = None

          try:
              result = fetch_csgotrader()
              print(f'CSGOTrader OK: {len(result)} items')
          except Exception as e:
              print(f'CSGOTrader failed: {e}', file=sys.stderr)

          if not result:
              try:
                  result = fetch_skinport()
                  print(f'Skinport OK: {len(result)} items')
              except Exception as e:
                  print(f'Skinport failed: {e}', file=sys.stderr)
                  sys.exit(1)

          with open('data/prices.json', 'w') as f:
              json.dump(result, f)
          print('Written to data/prices.json')
          PYEOF

      - name: Commit if changed
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "chore: update prices $(date -u '+%H:%M UTC')"
          git push
